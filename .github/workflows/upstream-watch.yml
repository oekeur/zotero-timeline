# Weekly check for upgrades Dependabot is told to ignore until upstream
# catches up. .github/upstream-watch.sh holds the watch list and opens one
# issue per watch once its blocker is gone.
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check watched upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/upstream-watch.sh
