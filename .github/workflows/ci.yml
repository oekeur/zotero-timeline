name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  # One job per Zotero major the manifest claims support for
  # (addon/manifest.json: strict_min_version 6.999, strict_max_version 10.*).
  #
  # The versions are pinned rather than pulled from the beta channel. Left to
  # itself the scaffold downloads `channel=beta` un-pinned, so CI would test a
  # moving target and a passing run would not record what it passed against.
  # `installZoteroLinux` returns early when ZOTERO_PLUGIN_ZOTERO_BIN_PATH is
  # already set, which is the seam these jobs use.
  #
  # The apt packages are installed here rather than left to the scaffold, which
  # shells out to `sudo apt update && sudo apt install -y` with stdio "pipe".
  # apt-get defaults DPkg::Lock::Timeout to -1, so when a runner's dpkg lock is
  # held by unattended-upgrades that call blocks forever and prints nothing.
  # Installing the same packages up front means the scaffold's `dpkg-query -W`
  # check finds them and never shells out, and the explicit lock timeout turns a
  # hang that does happen into a bounded, visible failure.
  #
  # Zotero 7 ships .tar.bz2 and 8+ ship .tar.xz. `tar -xf` detects both, so the
  # compression only varies in the URL.
  test:
    name: test (Zotero ${{ matrix.zotero }})
    runs-on: ubuntu-latest
    # A passing job takes ~2.5 min with a cold cache. This is a backstop for
    # the scaffold hanging with no output, not a performance budget.
    timeout-minutes: 10
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - zotero: "7"
            version: "7.0.32"
            url: "https://download.zotero.org/client/release/7.0.32/Zotero-7.0.32_linux-x86_64.tar.bz2"
          - zotero: "8"
            version: "8.0.4"
            url: "https://download.zotero.org/client/release/8.0.4/Zotero-8.0.4_linux-x86_64.tar.xz"
          - zotero: "9"
            version: "9.0.4"
            url: "https://download.zotero.org/client/release/9.0.4/Zotero-9.0.4_linux-x86_64.tar.xz"
          - zotero: "10"
            version: "10.0"
            url: "https://download.zotero.org/client/release/10.0/Zotero-10.0_linux-x86_64.tar.xz"
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Install Zotero runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y \
            xvfb x11-xkb-utils xkb-data libasound2t64 libdbus-glib-1-2

      - name: Cache Zotero
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zotero-${{ matrix.zotero }}
          key: zotero-${{ matrix.zotero }}-${{ matrix.url }}

      - name: Download and extract Zotero
        shell: bash
        run: |
          set -euo pipefail
          zotero_dir="${{ runner.temp }}/zotero-${{ matrix.zotero }}"
          if [ ! -x "$zotero_dir/Zotero_linux-x86_64/zotero" ]; then
            mkdir -p "$zotero_dir"
            curl -fL --retry 3 --output "$zotero_dir/zotero.tar" "${{ matrix.url }}"
            tar -xf "$zotero_dir/zotero.tar" -C "$zotero_dir"
            rm "$zotero_dir/zotero.tar"
          fi
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$zotero_dir/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"

      # Pinning the URL is not the same as running the pinned build. A restored
      # cache, a redirect, or an edited URL can all leave the job testing a
      # different Zotero than the matrix claims, and a green run would then
      # record a version it never exercised.
      #
      # On Linux the app version lives in <install>/app/application.ini. Match
      # on prefix rather than equality: release builds report the bare version
      # ("9.0.6"), while others append a build suffix
      # ("10.0-beta.25+1dbaec65b"), and the matrix pins a major line rather
      # than an exact build for 10.0.
      - name: Assert the extracted Zotero is the pinned version
        shell: bash
        run: |
          set -euo pipefail
          ini="${{ runner.temp }}/zotero-${{ matrix.zotero }}/Zotero_linux-x86_64/app/application.ini"
          if [ ! -f "$ini" ]; then
            echo "no application.ini at $ini; the archive layout changed"
            exit 1
          fi
          actual=$(sed -n 's/^Version=//p' "$ini" | head -1)
          expected="${{ matrix.version }}"
          echo "application.ini reports Version=$actual; matrix pins $expected"
          case "$actual" in
            "$expected" | "$expected".* | "$expected"-* | "$expected"+*) ;;
            *)
              echo "version mismatch: expected $expected, got $actual"
              exit 1
              ;;
          esac

      - name: Run tests
        run: npm run test

  # Early warning for the next Zotero. Deliberately un-pinned: it downloads
  # whatever the beta channel serves that day, which is what the pinned jobs
  # above stopped doing. It must never gate the build, hence continue-on-error.
  test-beta:
    name: test (Zotero beta, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Install Zotero runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y \
            xvfb x11-xkb-utils xkb-data libasound2t64 libdbus-glib-1-2

      - name: Run tests
        run: npm run test
