<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-hide-timeline-notes"
    preference="hideTimelineNotes"
    data-l10n-id="pref-hide-timeline-notes"
  />
  <html:p
    class="zoterotimeline-pref-help"
    data-l10n-id="pref-hide-timeline-notes-help"
  ></html:p>
</groupbox>
<groupbox
  aria-labelledby="zoterotimeline-vocabulary-heading"
  onload="
    Zotero.ZoteroTimeline.api.renderVocabularySettings(
      this.querySelector('.zoterotimeline-vocab-container'),
    )
  "
>
  <label>
    <html:h2
      id="zoterotimeline-vocabulary-heading"
      data-l10n-id="pref-vocabulary-heading"
    ></html:h2>
  </label>
  <html:div class="zoterotimeline-vocab-container"></html:div>
</groupbox>
<groupbox aria-labelledby="zoterotimeline-feedback-heading">
  <label>
    <html:h2
      id="zoterotimeline-feedback-heading"
      data-l10n-id="pref-feedback-heading"
    ></html:h2>
  </label>
  <html:div class="zoterotimeline-feedback-buttons">
    <button
      class="zoterotimeline-feedback-bug"
      data-l10n-id="pref-feedback-bug-button"
      oncommand="Zotero.ZoteroTimeline.api.openBugReport()"
    />
    <button
      class="zoterotimeline-feedback-feature"
      data-l10n-id="pref-feedback-feature-button"
      oncommand="Zotero.ZoteroTimeline.api.openFeatureRequest()"
    />
  </html:div>
  <html:p
    class="zoterotimeline-pref-help"
    data-l10n-id="pref-feedback-help"
  ></html:p>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
